  <g id="wayline-brand-mark">
    <!-- Left Arm -->
    <path d="M 36 42 L 72 42 L 108 108 C 104 116, 94 122, 85 120 C 76 118, 70 110, 66 104 L 36 42 Z" fill="url(#ribbonStoneGrad)" />
    <!-- Rising Wave -->
    <path d="M 85 126 C 98 126, 114 110, 126 90 L 144 58 C 150 48, 158 50, 163 56 L 167 62 C 160 55, 152 56, 147 64 L 128 98 C 117 118, 102 134, 85 126 Z" fill="url(#crestGrad)" />
    <!-- Under-fold -->
    <path d="M 148 64 C 153 56, 160 56, 166 62 L 176 76 C 182 86, 172 112, 150 112 C 138 112, 132 102, 138 92 L 148 64 Z" fill="url(#underfoldGrad)" />
    <!-- Right Arch Leg -->
    <path d="M 163 76 C 172 60, 192 24, 214 24 C 228 24, 236 34, 240 46 L 278 122 C 280 128, 274 134, 264 132 C 256 130, 252 122, 248 114 L 218 52 C 215 46, 208 44, 202 50 L 172 84 C 166 88, 161 84, 163 76 Z" fill="url(#rightLegGrad)" />
    <!-- Path Line -->
    <path d="M 163 88 C 170 78, 196 46, 212 36" stroke="#141C16" stroke-width="5" stroke-linecap="round" opacity="0.6" />
    <path d="M 163 88 C 170 78, 196 46, 212 36" stroke="#F6F4EB" stroke-width="3" stroke-linecap="round" />
    <!-- Apex Node -->
    <g transform="translate(214, 34)">
      <circle cx="0" cy="0" r="10" fill="#0E1611" stroke="#2D4336" stroke-width="1.5" />
      <circle cx="0" cy="0" r="5.5" fill="#F6F4EB" />
    </g>
    <!-- Compass Star -->
    <g transform="translate(258, 22)">
      <polygon points="0,0 0,-18 3.5,-3" fill="url(#starLight)" />
      <polygon points="0,0 0,-18 -3.5,-3" fill="url(#starDark)" />
      <polygon points="0,0 0,18 -3.5,3" fill="url(#starLight)" />
      <polygon points="0,0 0,18 3.5,3" fill="url(#starDark)" />
      <polygon points="0,0 16,0 3,-3.5" fill="url(#starLight)" />
      <polygon points="0,0 16,0 3,3.5" fill="url(#starDark)" />
      <polygon points="0,0 -16,0 -3,3.5" fill="url(#starLight)" />
      <polygon points="0,0 -16,0 -3,-3.5" fill="url(#starDark)" />
      <circle cx="0" cy="0" r="1.5" fill="#FFFFFF" />
    </g>

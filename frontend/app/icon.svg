<svg width="64" height="64" viewBox="0 0 320 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ribbonStoneGrad" x1="20%" y1="20%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#DAD7C7" />
      <stop offset="45%" stop-color="#C2C0B0" />
      <stop offset="85%" stop-color="#8B9B89" />
      <stop offset="100%" stop-color="#728271" />
    </linearGradient>
    <linearGradient id="crestGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B9B89" />
      <stop offset="40%" stop-color="#DAD7C7" />
      <stop offset="85%" stop-color="#E5E3D8" />
      <stop offset="100%" stop-color="#C2C0B0" />
    </linearGradient>
    <linearGradient id="underfoldGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#0B0F0D" />
      <stop offset="35%" stop-color="#1A261C" />
      <stop offset="70%" stop-color="#233527" />
      <stop offset="100%" stop-color="#2C4032" />
    </linearGradient>
    <linearGradient id="rightLegGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#557563" />
      <stop offset="30%" stop-color="#436352" />
      <stop offset="70%" stop-color="#324D3E" />
      <stop offset="100%" stop-color="#1F2F24" />
    </linearGradient>
    <linearGradient id="starLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
